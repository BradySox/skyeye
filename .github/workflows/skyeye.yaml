name: SkyEye
on:
  push:
    branches: [main, v2-dev]
  pull_request:
    branches: [main, v2-dev]
  release:
    types: [published]
permissions: {}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build whisper.cpp
        uses: ./.github/actions/build-whisper
      - name: Lint
        run: |
          make lint
          make vet
          make fix
          make format
          go mod tidy
          git diff --exit-code
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build whisper.cpp
        uses: ./.github/actions/build-whisper
      - name: Test
        run: make test
  build-windows-amd64:
    name: Build on Windows AMD64
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOROOT: /ucrt64/lib/go
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: |
            base-devel
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-libsoxr
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-curl
            zip
      - name: Build whisper.cpp
        uses: ./.github/actions/build-whisper
        with:
          os: windows
          shell: msys2 {0}
      - name: Build Skyeye
        shell: msys2 {0}
        run: make skyeye.exe
      - name: Build Skyeye Scaler
        shell: msys2 {0}
        run: make skyeye-scaler.exe
      - name: Create dist
        shell: msys2 {0}
        run: |
          mkdir -p dist/skyeye-windows-amd64/docs/
          cp skyeye.exe dist/skyeye-windows-amd64/skyeye.exe
          cp skyeye-scaler.exe dist/skyeye-windows-amd64/skyeye-scaler.exe
          curl -fsL https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe -o winsw.exe
          cp README.md dist/skyeye-windows-amd64/README.md
          cp LICENSE dist/skyeye-windows-amd64/LICENSE
          cp config.yaml dist/skyeye-windows-amd64/config.yaml
          cp docs/*.md dist/skyeye-windows-amd64/docs/
          cp winsw.exe dist/skyeye-windows-amd64/skyeye-service.exe
          cp init/winsw/skyeye-service.yml dist/skyeye-windows-amd64/skyeye-service.yml
          cp winsw.exe dist/skyeye-windows-amd64/skyeye-scaler-service.exe
          cp init/winsw/skyeye-scaler-service.yml dist/skyeye-windows-amd64/skyeye-scaler-service.yml
          cd dist
          zip -r skyeye-windows-amd64.zip skyeye-windows-amd64
      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v5
        with:
          name: skyeye-windows-amd64.zip
          path: dist/skyeye-windows-amd64.zip
          if-no-files-found: error
          overwrite: true
  build-windows-amd64-vulkan:
    name: Build on Windows AMD64 (Vulkan)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOROOT: /ucrt64/lib/go
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: |
            base-devel
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-libsoxr
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-headers
            zip
      - name: Build whisper.cpp
        uses: ./.github/actions/build-whisper
        with:
          os: windows
          shell: msys2 {0}
          make-args: GGML_VULKAN=1
      - name: Build Skyeye
        shell: msys2 {0}
        run: make skyeye-vulkan
      - name: Build Skyeye Scaler
        shell: msys2 {0}
        run: make skyeye-scaler.exe
      - name: Smoke test
        shell: msys2 {0}
        run: ./skyeye-vulkan.exe --help
      - name: Create dist
        shell: msys2 {0}
        run: |
          mkdir -p dist/skyeye-windows-amd64-vulkan/docs/
          cp skyeye-vulkan.exe dist/skyeye-windows-amd64-vulkan/skyeye.exe
          cp skyeye-scaler.exe dist/skyeye-windows-amd64-vulkan/skyeye-scaler.exe
          curl -fsL https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe -o winsw.exe
          cp README.md dist/skyeye-windows-amd64-vulkan/README.md
          cp LICENSE dist/skyeye-windows-amd64-vulkan/LICENSE
          cp config.yaml dist/skyeye-windows-amd64-vulkan/config.yaml
          cp docs/*.md dist/skyeye-windows-amd64-vulkan/docs/
          cp winsw.exe dist/skyeye-windows-amd64-vulkan/skyeye-service.exe
          cp init/winsw/skyeye-service.yml dist/skyeye-windows-amd64-vulkan/skyeye-service.yml
          cp winsw.exe dist/skyeye-windows-amd64-vulkan/skyeye-scaler-service.exe
          cp init/winsw/skyeye-scaler-service.yml dist/skyeye-windows-amd64-vulkan/skyeye-scaler-service.yml
          cd dist
          zip -r skyeye-windows-amd64-vulkan.zip skyeye-windows-amd64-vulkan
      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v5
        with:
          name: skyeye-windows-amd64-vulkan.zip
          path: dist/skyeye-windows-amd64-vulkan.zip
          if-no-files-found: error
          overwrite: true
  release:
    name: Upload release assets
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs:
      - lint
      - test
      - build-windows-amd64
      - build-windows-amd64-vulkan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: skyeye-*
          path: dist
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/skyeye-windows-amd64.zip
            dist/skyeye-windows-amd64-vulkan.zip
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
